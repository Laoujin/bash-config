# Lean starship prompt. No nerd font required — the git symbols (≡ ↑ ↓) are
# plain Unicode, so a UTF-8 locale is enough, including over SSH to the NAS.

add_newline = true

# Default is 500ms, which silently drops custom.git_posh in any repo on /mnt/c
# where `git status` alone costs ~600ms.
command_timeout = 2000

format = """
$username\
$hostname\
$directory\
${custom.git_posh}\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold blue"

# The branch is rendered by git-prompt.sh so a single module owns both brackets.
[git_branch]
disabled = true

# Replaced by custom.git_posh: git_status cannot render zero counts, and
# posh-git's "+0 ~2 -0" shows them always.
[git_status]
disabled = true

[custom.git_posh]
command = "$HOME/.config/starship-git-prompt.sh"
when = true
shell = ["bash", "--noprofile", "--norc"]
# The script emits its own ANSI colour, so no $style here.
# Parenthesised so the trailing space disappears outside a git repo.
format = "($output )"

[cmd_duration]
min_time = 2_000
format = "took [$duration](yellow) "

[hostname]
ssh_only = true
format = "[$hostname](bold red) "

[username]
show_always = false
format = "[$user]($style)@"
